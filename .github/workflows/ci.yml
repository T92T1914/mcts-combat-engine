name: CI

on:
  push:
  pull_request:

# checkout v5 and setup-python v6 are the Node 24 releases; GitHub has
# deprecated the Node 20 runtime the v4/v5 lines run on.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      # zero dependencies: no install step, the standard library is the stack
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # dev-only tools, pinned to the versions the repo was checked with;
      # nothing under engine/ or game/ imports them. Rules live in pyproject.
      - run: python -m pip install ruff==0.16.6 mypy==2.2.0
      - run: ruff check .
      - run: mypy

  installed-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and install the engine wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          consumer_root=$(mktemp -d "$RUNNER_TEMP/mcts-installed-policy.XXXXXX")
          python -m pip wheel --no-deps --wheel-dir "$consumer_root/wheels" .
          python -m venv "$consumer_root/venv"
          "$consumer_root/venv/bin/python" -m pip install --no-index --no-deps "$consumer_root"/wheels/*.whl
          mkdir "$consumer_root/run"
          python tools/build_episode_companion.py
          cd "$consumer_root/run"
          # GNU timeout owns this consumer's process group, including spawned
          # workers. TERM then KILL bounds this test if retirement stalls.
          # The runner disposes of the one mktemp directory after the job.
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_policy_smoke.py"
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_companion_smoke.py" "$GITHUB_WORKSPACE/_site/episode-companion.zip" "$consumer_root/journey"
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_reference_smoke.py" "$consumer_root/journey"
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_horizon_smoke.py" "$consumer_root/journey"

  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify the scoped Windows process owner and recovery contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_encounter_process.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_encounter_recovery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the installed engine and relocated managed companion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $consumerRoot = Join-Path $env:RUNNER_TEMP ('mcts-managed-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $consumerRoot | Out-Null
          # Keep literal blob bytes without changing the runner's Git settings.
          git -c core.autocrlf=false -c core.eol=lf archive HEAD -o (Join-Path $consumerRoot 'source.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath (Join-Path $consumerRoot 'source.zip') -DestinationPath (Join-Path $consumerRoot 'source')
          python -m pip wheel --no-deps --wheel-dir (Join-Path $consumerRoot 'wheels') (Join-Path $consumerRoot 'source')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv (Join-Path $consumerRoot 'venv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $managedPython = Join-Path $consumerRoot 'venv/Scripts/python.exe'
          $wheel = Get-ChildItem -LiteralPath (Join-Path $consumerRoot 'wheels') -Filter '*.whl'
          if ($wheel.Count -ne 1) { throw 'Expected one engine wheel' }
          & $managedPython -m pip install --no-index --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_episode_companion.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $run = Join-Path $consumerRoot 'run'
          $journey = Join-Path $consumerRoot 'journey'
          New-Item -ItemType Directory -Path $run | Out-Null
          Push-Location $run
          try {
            & $managedPython -I (Join-Path $env:GITHUB_WORKSPACE 'tools/installed_companion_smoke.py') (Join-Path $env:GITHUB_WORKSPACE '_site/episode-companion.zip') $journey
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $managedPython -I (Join-Path $env:GITHUB_WORKSPACE 'tools/installed_managed_smoke.py') $journey
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $managedPython -I (Join-Path $env:GITHUB_WORKSPACE 'tools/installed_managed_fault_smoke.py') $journey
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
