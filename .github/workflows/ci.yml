name: CI

on:
  push:
  pull_request:

# checkout v5 and setup-python v6 are the Node 24 releases; GitHub has
# deprecated the Node 20 runtime the v4/v5 lines run on.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      # zero dependencies: no install step, the standard library is the stack
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # dev-only tools, pinned to the versions the repo was checked with;
      # nothing under engine/ or game/ imports them. Rules live in pyproject.
      - run: python -m pip install ruff==0.16.6 mypy==2.2.0
      - run: ruff check .
      - run: mypy

  installed-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and install the engine wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          consumer_root=$(mktemp -d "$RUNNER_TEMP/mcts-installed-policy.XXXXXX")
          python -m pip wheel --no-deps --wheel-dir "$consumer_root/wheels" .
          python -m venv "$consumer_root/venv"
          "$consumer_root/venv/bin/python" -m pip install --no-index --no-deps "$consumer_root"/wheels/*.whl
          mkdir "$consumer_root/run"
          python tools/build_episode_companion.py
          cd "$consumer_root/run"
          # GNU timeout owns this consumer's process group, including spawned
          # workers. TERM then KILL bounds this test if retirement stalls.
          # The runner disposes of the one mktemp directory after the job.
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_policy_smoke.py"
          timeout --signal=TERM --kill-after=5s 90s "$consumer_root/venv/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_companion_smoke.py" "$GITHUB_WORKSPACE/_site/episode-companion.zip" "$consumer_root/journey"
